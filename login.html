<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sage Energy – Login</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/images/logo.png" type="image/png" />
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">

      <!-- Logo / Branding -->
      <div class="login-logo">
        <img src="assets/images/logo.png" alt="Sage Energies" class="login-logo-img" />
        <p>and Natural Resources Ltd</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="admin@sageenergy.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
        </div>

        <!-- Error message box (hidden by default) -->
        <div id="loginError" class="error-msg" style="display:none;"></div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span id="loginText">Sign In</span>
          <span id="loginSpinner" style="display:none;">Signing in…</span>
        </button>
      </form>

      <p class="login-footer">&copy; 2024 Sage Energy and Natural Resources Ltd</p>
    </div>
  </div>

  <!-- Firebase CDN (Auth only needed on login page) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    // If user is already logged in, skip to dashboard
    firebase.auth().onAuthStateChanged(function (user) {
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });

    // Handle form submission
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');

      // Show loading state
      document.getElementById('loginText').style.display    = 'none';
      document.getElementById('loginSpinner').style.display = 'inline';
      errorDiv.style.display = 'none';

      try {
        // Firebase Auth – sign in with email and password
        await firebase.auth().signInWithEmailAndPassword(email, password);
        // On success, Firebase listener above will redirect automatically
      } catch (err) {
        // Map Firebase error codes to friendly messages
        const messages = {
          'auth/wrong-password'      : 'Incorrect password. Please try again.',
          'auth/user-not-found'      : 'No account found with this email address.',
          'auth/invalid-email'       : 'Please enter a valid email address.',
          'auth/too-many-requests'   : 'Too many failed attempts. Please wait and try again.',
          'auth/invalid-credential'  : 'Invalid email or password. Please try again.',
        };
        errorDiv.textContent  = messages[err.code] || 'Login failed. Please check your details.';
        errorDiv.style.display = 'block';
      } finally {
        // Reset button state
        document.getElementById('loginText').style.display    = 'inline';
        document.getElementById('loginSpinner').style.display = 'none';
      }
    });
  </script>
</body>
</html>
