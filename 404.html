<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found &ndash; Sage Energy</title>
  <meta name="description" content="Sage Energy and Natural Resources Ltd – Page not found." />
  <link rel="icon" href="assets/images/logo.png" type="image/png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a2a3a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(13,33,55,0.10);
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo-wrap { margin-bottom: 28px; }
    .logo-wrap img { height: 56px; max-width: 220px; object-fit: contain; }
    .error-code {
      font-size: 5rem;
      font-weight: 900;
      color: #e8f0fa;
      letter-spacing: -4px;
      line-height: 1;
      margin-bottom: 8px;
    }
    .error-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0d2137;
      margin-bottom: 12px;
    }
    .error-msg {
      font-size: 0.925rem;
      color: #5a6a7a;
      line-height: 1.65;
      margin-bottom: 32px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn-primary {
      background: #1e88e5;
      color: #fff;
      border: 2px solid #1e88e5;
    }
    .btn-primary:hover { background: #1565c0; border-color: #1565c0; }
    .btn-secondary {
      background: #f0f4f8;
      color: #0d2137;
      border: 2px solid #d0dae6;
    }
    .btn-secondary:hover { background: #e3ecf5; }
    .divider {
      border: none;
      border-top: 1px solid #e8edf4;
      margin: 28px 0 20px;
    }
    .footer-note {
      font-size: 0.78rem;
      color: #8a9ab0;
    }
    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      .error-code { font-size: 4rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="assets/images/logo.png" alt="Sage Energies" />
    </div>

    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-msg">
      The page you are looking for does not exist or may have been moved.
      Please check the URL and try again, or use the links below to get back on track.
    </p>

    <div class="btn-group">
      <a href="index.html" class="btn btn-primary">&#8592; Go to Login</a>
      <a href="customer-login.html" class="btn btn-secondary">Customer Portal</a>
    </div>

    <hr class="divider" />
    <p class="footer-note">&copy; 2026 Sage Energy and Natural Resources Ltd</p>
  </div>
</body>
</html>
