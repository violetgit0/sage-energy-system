<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sage Energy &ndash; Customer Registration</title>
  <meta name="description" content="Sage Energy and Natural Resources Ltd – Create a customer account to place fuel orders online." />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/images/logo.png" type="image/png" />
</head>
<body class="login-page">

  <div class="login-container" style="max-width:480px;">
    <div class="login-card">

      <div class="login-logo">
        <img src="assets/images/logo.png" alt="Sage Energies" class="login-logo-img" />
        <p>Create a Customer Account</p>
      </div>

      <form id="registerForm">

        <div class="form-group">
          <label for="regName">Full Name *</label>
          <input type="text" id="regName" placeholder="e.g. John Adebayo" required />
        </div>

        <div class="form-group">
          <label for="regEmail">Email Address *</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="regPhone">Phone Number *</label>
          <input type="tel" id="regPhone" placeholder="+234 xxx xxxx xxx" required />
        </div>

        <div class="form-group">
          <label for="regAddress">Default Delivery Address</label>
          <input type="text" id="regAddress"
                 placeholder="Street, City, State (optional)" />
        </div>

        <div class="form-group">
          <label for="regPassword">Password *</label>
          <input type="password" id="regPassword"
                 placeholder="At least 6 characters" required minlength="6" />
        </div>

        <div class="form-group">
          <label for="regConfirm">Confirm Password *</label>
          <input type="password" id="regConfirm"
                 placeholder="Repeat your password" required minlength="6" />
        </div>

        <div id="registerError" class="error-msg" style="display:none;"></div>

        <button type="submit" class="btn-login" id="registerBtn">
          <span id="registerText">Create Account</span>
          <span id="registerSpinner" style="display:none;">Creating account&hellip;</span>
        </button>

      </form>

      <p style="text-align:center; margin-top:22px; font-size:0.875rem; color:#5a6a7a;">
        Already have an account?
        <a href="customer-login.html"
           style="color:#1e88e5; font-weight:700;">Sign in</a>
      </p>

      <p class="login-footer">&copy; 2026 Sage Energy and Natural Resources Ltd</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    // If already logged in as a customer, skip straight to dashboard
    firebase.auth().onAuthStateChanged(async function (user) {
      if (user) {
        var doc = await db.collection('customers').doc(user.uid).get();
        if (doc.exists) {
          window.location.href = 'customer-dashboard.html';
        }
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      var name     = document.getElementById('regName').value.trim();
      var email    = document.getElementById('regEmail').value.trim();
      var phone    = document.getElementById('regPhone').value.trim();
      var address  = document.getElementById('regAddress').value.trim();
      var password = document.getElementById('regPassword').value;
      var confirm  = document.getElementById('regConfirm').value;
      var errorDiv = document.getElementById('registerError');

      // Check that both passwords match before sending to Firebase
      if (password !== confirm) {
        errorDiv.textContent  = 'Passwords do not match. Please try again.';
        errorDiv.style.display = 'block';
        return;
      }

      document.getElementById('registerText').style.display    = 'none';
      document.getElementById('registerSpinner').style.display = 'inline';
      errorDiv.style.display = 'none';

      try {
        // Step 1: Create the Firebase Auth account
        var credential = await firebase.auth().createUserWithEmailAndPassword(email, password);
        var uid = credential.user.uid;

        // Step 2: Save the customer's profile to Firestore
        await db.collection('customers').doc(uid).set({
          name:      name,
          email:     email,
          phone:     phone,
          address:   address,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });

        // Step 3: Go to the customer dashboard
        window.location.href = 'customer-dashboard.html';

      } catch (err) {
        var messages = {
          'auth/email-already-in-use': 'An account with this email already exists. Please sign in.',
          'auth/invalid-email'        : 'Please enter a valid email address.',
          'auth/weak-password'        : 'Password must be at least 6 characters long.',
        };
        errorDiv.textContent  = messages[err.code] || 'Registration failed. Please try again.';
        errorDiv.style.display = 'block';
      } finally {
        document.getElementById('registerText').style.display    = 'inline';
        document.getElementById('registerSpinner').style.display = 'none';
      }
    });
  </script>
</body>
</html>
